<section class="auth">

  <form
    class="formulario"
    [formGroup]="formulario"
    (ngSubmit)="iniciarSesion()">

    <h1>Iniciar sesión</h1>

    <input
      type="email"
      placeholder="Email"
      formControlName="email">

    <input
      type="password"
      placeholder="Contraseña"
      formControlName="password">

    <button
      type="submit"
      [disabled]="formulario.invalid">

      Ingresar

    </button>

    <p>{{ mensaje }}</p>

    <p>
      ¿No tenés cuenta?

      <a routerLink="/registro">
        Registrate
      </a>
    </p>

  </form>

</section>
